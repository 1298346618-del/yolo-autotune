name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 单元测试只覆盖纯逻辑（简化原则 / 早停 / 任务画像 / TSV / git 护栏），
      # 不导入 torch 和 ultralytics，因此 CI 不需要装 GPU 依赖。
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml ruff

      - name: Byte-compile every module
        run: python -m compileall -q .

      - name: Lint (fatal errors only)
        run: ruff check . --select E9,F63,F7,F82 --show-source

      - name: Unit tests
        run: pytest -q
