# ============================================================
# 任务画像（Task Profile）
# ------------------------------------------------------------
# 这个文件里的内容会被原样注入 LLM 的 system prompt。
# 换一个新任务时，只改这里，不需要动 policy/llm.py 一行代码。
# ============================================================

task_name: "PCB 缺陷检测"

# 一句话说明任务
task_description: |
  PCB 印刷电路板 6 类缺陷检测（open / short / mousebite / spur / pinhole /
  spurious_copper），属于工业小目标检测场景，标注成本高、样本量小。

# 数据规模与特点（LLM 会据此判断过拟合风险）
dataset_notes: |
  - 小数据集：约 449 张训练图 / 100 张验证图，平均每类约 91 个实例
  - 缺陷目标很小，定位精度（mAP50-95）与分类同样重要
  - 验证集不大，单轮 mAP 波动明显，判断提升要看趋势而非单点

# 训练模式：finetune（在已训练权重上微调）| scratch（从零训练）
training_mode: finetune

# 领域经验：这些是"先验知识"，Agent 会结合实验结果验证它们
domain_hints: |
  - 微调模式下 lr0 不宜过大（<=0.02），warmup 要短
  - 提高 box 损失权重通常有利于小目标定位
  - 过强的 mosaic / mixup 会破坏小缺陷的细节，建议偏低
  - 数据量小，适当提高 weight_decay / dropout 有助于防过拟合

# 参数调优优先级（从高到低）
priorities:
  - lr0
  - box
  - cls
  - 数据增强强度
  - 其他参数
